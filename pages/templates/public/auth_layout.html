{% extends 'base.html' %}
{% load static %}
{# Shared card shell for the Log in / Sign up pages. Child pages fill the blocks. #}

{% block content %}
<main class="flex min-h-screen items-center justify-center bg-white px-3 py-6 sm:px-6">
    <section class="flex min-h-[587px] w-full max-w-[839px] flex-col items-center rounded-[22px] border-2 border-black bg-white px-5 pb-7 shadow-[0_8px_10px_rgba(0,0,0,0.25)] sm:px-8">

        <a href="{% url 'home' %}" class="block shrink-0 {% block logo_class %}{% endblock %}" aria-label="Bespren Johny's Fried Chicken - Home">
            <img src="{% static 'icons/logo.png' %}" alt="Bespren Johny's Fried Chicken"
                 class="aspect-[1.35] w-full object-cover object-[center_61%]">
        </a>

        <h1 class="text-center text-[34px] font-extrabold leading-[44px] [text-shadow:2px_3px_4px_rgba(0,0,0,0.35)] sm:text-4xl {% block heading_class %}{% endblock %}">
            {% block heading %}{% endblock %}
        </h1>

        {% block body %}{% endblock %}

        <p class="mt-auto pt-9 text-center text-[10.5px] leading-[14px]">
            {% block bottom %}{% endblock %}
        </p>
    </section>
</main>
{% endblock %}
