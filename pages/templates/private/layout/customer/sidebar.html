{% load static %}

<aside
    id="appSidebar"
    class="fixed inset-y-0 left-0 z-50 flex w-[280px] -translate-x-full flex-col overflow-y-auto border-r border-white/10 bg-[#211513] text-white shadow-2xl transition-transform duration-300 ease-in-out lg:sticky lg:top-0 lg:h-screen lg:shrink-0 lg:translate-x-0 lg:shadow-none"
>
    <a href="{% url 'dashboard' %}" class="flex items-center gap-3 border-b border-white/10 px-6 py-6">
        <span class="flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-2xl bg-white">
            <img src="{% static 'icons/logo.png' %}" alt="BJFC" class="h-10 w-10 object-contain">
        </span>
        <span>
            <span class="block text-lg font-black tracking-wide">BJFC</span>
            <span class="block text-xs font-semibold text-white/55">Order management</span>
        </span>
    </a>

    <div class="px-6 pb-3 pt-7 text-[10px] font-extrabold uppercase tracking-[0.2em] text-white/40">Workspace</div>
    <nav aria-label="Customer navigation" class="flex flex-1 flex-col gap-1 px-3 pb-5">
        <a href="{% url 'dashboard' %}" {% if request.resolver_match.url_name == 'dashboard' %}aria-current="page"{% endif %} class="group flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-bold transition {% if request.resolver_match.url_name == 'dashboard' %}bg-[#800000] text-white shadow-lg shadow-black/15{% else %}text-white/75 hover:bg-white/10 hover:text-white{% endif %}">
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>
            Dashboard
        </a>
        <a href="{% url 'my_orders' %}" {% if request.resolver_match.url_name == 'my_orders' %}aria-current="page"{% endif %} class="group flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-bold transition {% if request.resolver_match.url_name == 'my_orders' %}bg-[#800000] text-white shadow-lg shadow-black/15{% else %}text-white/75 hover:bg-white/10 hover:text-white{% endif %}">
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h2l2.2 11.2a2 2 0 0 0 2 1.6h8.9a2 2 0 0 0 2-1.6L22 7H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg>
            My Orders
        </a>
        <a href="{% url 'customer_account' %}" {% if request.resolver_match.url_name == 'customer_account' %}aria-current="page"{% endif %} class="group flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-bold transition {% if request.resolver_match.url_name == 'customer_account' %}bg-[#800000] text-white shadow-lg shadow-black/15{% else %}text-white/75 hover:bg-white/10 hover:text-white{% endif %}">
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            Account
        </a>

        <div class="mt-auto rounded-2xl border border-white/10 bg-white/5 p-4">
            <p class="text-sm font-extrabold">Need a hand?</p>
            <p class="mt-1 text-xs leading-5 text-white/55">Reach the BJFC team for help with your workspace.</p>
            <a href="{% url 'contact' %}" class="mt-3 inline-flex text-xs font-extrabold text-[#ffd6a8] hover:text-white">Contact support <span class="ml-1" aria-hidden="true">→</span></a>
        </div>
    </nav>
</aside>

<div id="sidebarOverlay" class="fixed inset-0 z-40 hidden bg-[#160d0b]/60 backdrop-blur-[2px] lg:hidden"></div>
