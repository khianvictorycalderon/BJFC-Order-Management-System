
{% load static %}

<aside
    id="adminSidebar"
    class="fixed inset-y-0 left-0 z-50 min-h-screen w-64 -translate-x-full overflow-y-auto bg-[#070616] border-r border-white/60 text-white transition-transform duration-300 ease-in-out lg:static lg:min-h-screen lg:w-64 lg:shrink-0 lg:translate-x-0"
>
    <div class="hidden border-b border-white/20 lg:block">
        <div class="flex items-center gap-3 bg-[#800000] px-4 py-5">
            <img
                src="{% static 'icons/logo.png' %}"
                alt="BJFC Logo"
                class="h-12 w-12 object-contain"
            >

            <div>
                <h1 class="text-lg font-extrabold text-white">BJFC</h1>
                <p class="text-xs text-white/70">Admin Panel</p>
            </div>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="flex flex-col gap-2 p-4">

        <a
            href="{% url 'admin_dashboard' %}"
            class="rounded-lg px-4 py-3 transition hover:bg-[#800000]/50"
        >
            Dashboard
        </a>

        <a
            href="{% url 'admin_menu' %}"
            class="rounded-lg px-4 py-3 transition hover:bg-[#800000]/50"
        >
            Menu
        </a>

        <a
            href="{% url 'admin_orders' %}"
            class="rounded-lg px-4 py-3 transition hover:bg-[#800000]/50"
        >
            Orders
        </a>

        <a
            href="{% url 'admin_feedback' %}"
            class="rounded-lg px-4 py-3 transition hover:bg-[#800000]/50"
        >
            Feedback
        </a>

        <a
            href="{% url 'admin_settings' %}"
            class="rounded-lg px-4 py-3 transition hover:bg-[#800000]/50"
        >
            Settings
        </a>

        <a
            href="{% url 'admin_account' %}"
            class="rounded-lg px-4 py-3 transition hover:bg-[#800000]/50"
        >
            Account
        </a>

    </nav>
</aside>

<div
    id="sidebarOverlay"
    class="fixed inset-0 z-40 hidden bg-black/50 lg:hidden"
></div>
