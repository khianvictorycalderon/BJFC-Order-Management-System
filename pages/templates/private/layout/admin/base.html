
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Admin Panel{% endblock %} | BJFC</title>

    <script src="{% static 'js/tailwind-3.4.17.js' %}"></script>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <style>
        body {
            font-family: 'Nunito', sans-serif;
        }
    </style>
</head>

<body class="min-h-screen bg-[#FFF7E8] text-gray-800">

    <div class="min-h-screen lg:flex">

        {% include "private/layout/admin/sidebar.html" %}


        <div class="min-w-0 flex-1">


            <header class="flex items-center justify-between bg-[#800000] px-4 py-3 text-white lg:hidden">


                <div class="flex items-center gap-3">
                    <img
                        src="{% static 'icons/logo.png' %}"
                        alt="BJFC Logo"
                        class="h-10 w-10 object-contain"
                    >

                    <div>
                        <h1 class="text-lg font-extrabold">BJFC</h1>
                        <p class="text-xs text-white/70">Admin Panel</p>
                    </div>
                </div>

                <button
                    id="sidebarToggle"
                    type="button"
                    aria-label="Toggle sidebar"
                    aria-controls="adminSidebar"
                    aria-expanded="false"
                    class="rounded-lg p-2 transition hover:bg-white/10"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="h-7 w-7"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke="currentColor"
                        stroke-width="2"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M4 6h16M4 12h16M4 18h16"
                        />
                    </svg>
                </button>
            </header>

            <header class="hidden items-center justify-between bg-[#800000] px-6 py-4 text-white lg:flex">
                <h2 class="text-xl font-bold">
                    {% block page_heading %}Dashboard{% endblock %}
                </h2>

                <div class="text-sm font-semibold">
                    Admin
                </div>
            </header>

            <main class="p-4 sm:p-6 lg:p-8">
                {% block content %}{% endblock %}
            </main>

        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const sidebar = document.getElementById("adminSidebar");
            const toggle = document.getElementById("sidebarToggle");
            const overlay = document.getElementById("sidebarOverlay");

            if (!sidebar || !toggle || !overlay) {
                return;
            }

            function openSidebar() {
                sidebar.classList.remove("-translate-x-full");
                overlay.classList.remove("hidden");
                toggle.setAttribute("aria-expanded", "true");
                document.body.classList.add("overflow-hidden");
            }

            function closeSidebar() {
                sidebar.classList.add("-translate-x-full");
                overlay.classList.add("hidden");
                toggle.setAttribute("aria-expanded", "false");
                document.body.classList.remove("overflow-hidden");
            }

            toggle.addEventListener("click", function () {
                if (sidebar.classList.contains("-translate-x-full")) {
                    openSidebar();
                } else {
                    closeSidebar();
                }
            });

            overlay.addEventListener("click", closeSidebar);

            sidebar.querySelectorAll("a").forEach(function (link) {
                link.addEventListener("click", function () {
                    if (window.innerWidth < 1024) {
                        closeSidebar();
                    }
                });
            });

            document.addEventListener("keydown", function (event) {
                if (event.key === "Escape") {
                    closeSidebar();
                }
            });

            window.addEventListener("resize", function () {
                if (window.innerWidth >= 1024) {
                    sidebar.classList.remove("-translate-x-full");
                    overlay.classList.add("hidden");
                    document.body.classList.remove("overflow-hidden");
                    toggle.setAttribute("aria-expanded", "false");
                } else {
                    sidebar.classList.add("-translate-x-full");
                    overlay.classList.add("hidden");
                    document.body.classList.remove("overflow-hidden");
                    toggle.setAttribute("aria-expanded", "false");
                }
            });
        });
    </script>

</body>
</html>
