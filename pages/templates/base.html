{% load static %}
<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <script src="{% static 'js/tailwind-3.4.17.js' %}"></script>
        <script src="{% static 'js/chart.js' %}"></script>
        <style>
            @layer components {
                .footer-link {
                    @apply inline-flex items-center gap-2 text-sm text-white/75 transition duration-200 hover:translate-x-1 hover:text-white;
                }
            }
        </style>

        <title>
            {% block title %}{% endblock %}
        </title>
    </head>
    <body>
        {% block content %}
        {% endblock %}
    </body>
</html>
