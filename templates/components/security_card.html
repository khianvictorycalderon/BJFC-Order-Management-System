{# Mock "Security & Password" card shared by admin + customer account pages. UI only: no form action, buttons inert. #}
<section class="rounded-3xl border border-[#eadfd2] bg-white p-6 shadow-sm sm:p-8">
    <header class="flex items-start gap-4 border-b border-[#f0e7de] pb-5">
        <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-[#fff1e3] text-[#800000]">
            <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        </span>
        <div>
            <h3 class="text-lg font-extrabold text-[#2b201d]">Security &amp; password</h3>
            <p class="mt-0.5 text-sm text-[#89776e]">Use at least 8 characters with a mix of letters and numbers.</p>
        </div>
    </header>

    <form onsubmit="return false" class="pt-6" novalidate>
        <div class="grid gap-5 sm:grid-cols-2">
            <div class="sm:col-span-2">
                <label for="currentPassword" class="mb-2 block text-[11px] font-extrabold uppercase tracking-[0.14em] text-[#89776e]">Current password</label>
                <input id="currentPassword" type="password" placeholder="Enter current password" autocomplete="current-password" class="h-12 w-full rounded-xl border border-[#eadfd2] bg-[#fffaf4] px-4 text-sm font-semibold text-[#342724] outline-none transition placeholder:font-medium placeholder:text-[#b9a79d] focus:border-[#800000] focus:bg-white focus:ring-4 focus:ring-[#800000]/10">
            </div>
            <div>
                <label for="newPassword" class="mb-2 block text-[11px] font-extrabold uppercase tracking-[0.14em] text-[#89776e]">New password</label>
                <input id="newPassword" type="password" placeholder="Enter new password" autocomplete="new-password" class="h-12 w-full rounded-xl border border-[#eadfd2] bg-[#fffaf4] px-4 text-sm font-semibold text-[#342724] outline-none transition placeholder:font-medium placeholder:text-[#b9a79d] focus:border-[#800000] focus:bg-white focus:ring-4 focus:ring-[#800000]/10">
            </div>
            <div>
                <label for="confirmPassword" class="mb-2 block text-[11px] font-extrabold uppercase tracking-[0.14em] text-[#89776e]">Confirm new password</label>
                <input id="confirmPassword" type="password" placeholder="Re-enter new password" autocomplete="new-password" class="h-12 w-full rounded-xl border border-[#eadfd2] bg-[#fffaf4] px-4 text-sm font-semibold text-[#342724] outline-none transition placeholder:font-medium placeholder:text-[#b9a79d] focus:border-[#800000] focus:bg-white focus:ring-4 focus:ring-[#800000]/10">
            </div>
        </div>
        <div class="mt-7 flex justify-end border-t border-[#f0e7de] pt-6">
            <button type="button" class="inline-flex h-11 items-center justify-center rounded-xl bg-[#800000] px-6 text-sm font-extrabold text-white shadow-sm transition hover:bg-[#650000] focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-[#800000]/25">Update password</button>
        </div>
    </form>
</section>
